# Push a version tag and this builds, tests and publishes a GitHub release:
#
#   git tag -a v0.2.0 -m "san_vpn v0.2.0" && git push origin v0.2.0
#
# The binaries come from build.sh, the same script as a local build, stamped
# with the tag as their version. The relay's container image, for Cloud Run,
# goes to ghcr.io/<owner>/san_vpn:<tag> (and :latest). A tag with a "-"
# (v0.2.0-rc1) becomes a prerelease, and does not move :latest.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet, test and build
        env:
          SAN_VPN_VERSION: ${{ github.ref_name }}
        run: bash build.sh

      - name: Package
        run: |
          mkdir dist
          cp bin/san_vpn.exe dist/san_vpn-windows-amd64.exe
          cp bin/san_vpn dist/san_vpn-linux-amd64
          cp bin/san_vpn-linux-arm64 bin/san_vpn-linux-arm dist/
          # The Windows binary embeds wintun.dll; its license travels with it.
          cp internal/osnet/wintun/LICENSE.txt dist/wintun-LICENSE.txt
          (cd dist && sha256sum -- * > SHA256SUMS)
          ./bin/san_vpn --version

      - name: Container image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${REPO,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg VERSION="$TAG" \
            --label org.opencontainers.image.source="https://github.com/$REPO" \
            -t "$image:$TAG" .
          docker run --rm --entrypoint /san_vpn "$image:$TAG" --version
          docker push "$image:$TAG"
          if [[ "$TAG" != *-* ]]; then
            docker tag "$image:$TAG" "$image:latest"
            docker push "$image:latest"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          One file per OS. Setup is in the [README](https://github.com/$REPO/blob/$TAG/README.md).

          - **Windows**: \`san_vpn-windows-amd64.exe\`. Wintun is built in; \`up\` writes \`wintun.dll\` next to the exe.
          - **Linux**: \`san_vpn-linux-amd64\`, then \`chmod +x\`.
          - **Raspberry Pi**: \`san_vpn-linux-arm64\` when \`uname -m\` says \`aarch64\`, \`san_vpn-linux-arm\` when it says \`armv6l\` or \`armv7l\`; then \`chmod +x\`.
          - Check downloads against \`SHA256SUMS\`.
          - **Relay on Cloud Run**: image \`ghcr.io/${REPO,,}:$TAG\`, which \`san_vpn setup cloudrun\` deploys.
          EOF
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* "${prerelease[@]}" \
            --verify-tag --title "san_vpn $TAG" \
            --notes-file notes.md --generate-notes
